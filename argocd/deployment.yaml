apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelbot-backend
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travelbot-backend
      role: travelbot-backend
  template:
    metadata:
      labels:
        app: travelbot-backend
        role: travelbot-backend
    spec:
      containers:
        - name: travelbot-backend
          image: 100.104.24.208:5000/container-registry/ai-projects/travelbot/travelbot-backend-python:v0.0.1-uat
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
