[project]
name = "travel-buddy-python"
version = "0.1.0"
description = "Travel Buddy Python backend — FastAPI AI agent + BankG & MakeMyTrip travel integrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "python-dotenv>=1.0.0",
    "pycryptodome>=3.20.0",
    "anyio>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
